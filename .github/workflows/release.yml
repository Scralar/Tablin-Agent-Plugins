name: release
on:
  push:
    branches: [main]
    paths: [plugins.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Build zips and hashes
        run: node scripts/build.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugins.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released. Raise the version in plugins.json to publish."
            exit 0
          fi
          gh release create "v$version" dist/*.zip plugins.json --target "$GITHUB_SHA" --title "$version" --notes "Agent link plugin packages $version. Each zip's SHA-256 is in plugins.json."
